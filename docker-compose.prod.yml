# Production deployment: PostgreSQL, Redis and the bot on one host.
#
# Differences from docker-compose.yml (the local/dev stack):
#   * PostgreSQL and Redis are NOT published on any host port - they are
#     reachable only inside the compose network, so the host exposes nothing.
#   * The bot's health endpoint is bound to 127.0.0.1, so metrics are visible
#     on the machine (ssh port-forward or curl) but not to the internet.
#   * POSTGRES_PASSWORD and REDIS_PASSWORD are required and must be strong.
#   * Logs are rotated and memory limits are set, so a leak or a noisy log
#     cannot fill the disk or starve the host.
#
#   cp .env.example .env       # then fill in the values listed in DEPLOY.md
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f bot
#   docker compose -f docker-compose.prod.yml run --rm bot doctor --skip-discord
#
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thesun}
      # Required: the stack refuses to start without a real password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-thesun}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thesun} -d ${POSTGRES_DB:-thesun}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No `ports:` on purpose: the database must not be reachable from outside.
    mem_limit: 512m
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set a strong REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    volumes:
      - redis-data:/data
    healthcheck:
      # compose substitutes the value at parse time; quotes guard special chars.
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    # No `ports:` on purpose: the cache must not be reachable from outside.
    mem_limit: 256m
    logging: *default_logging

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network the services are reached by name. Passwords
      # come from .env; use URL-safe characters there (letters, digits, - _ ~).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-thesun}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thesun}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      METRICS_ENABLED: "true"
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 8080
      APP_ENV: production
      LOG_JSON: "true"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      CHECK_CONFIG_ON_START: ${CHECK_CONFIG_ON_START:-true}
    ports:
      # Loopback only: the health endpoint stays off the public internet.
      - "127.0.0.1:${HEALTH_PORT:-8080}:8080"
    stop_grace_period: 30s
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default_logging

volumes:
  postgres-data:
  redis-data:
